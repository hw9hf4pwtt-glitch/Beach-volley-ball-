<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Beach Volleyball</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3d1f5a;--pink:#ff7a45;--pinkd:#d4532a;--panel:rgba(255,255,255,.93);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#2b1a5c,#8a2f8f 50%,#ff8a45);color:#fff4e6;font-family:Nunito,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#stage{position:relative;width:min(96vw,calc(88vh*1.8));aspect-ratio:9/5}
canvas{width:100%;height:100%;display:block;border-radius:22px;border:4px solid #fff;box-shadow:0 14px 36px rgba(20,5,50,.5)}
#pauseBtn{position:absolute;right:14px;bottom:12px;z-index:3;display:none;padding:7px 18px;font-size:14px}
#ui{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
.card{color:var(--ink);background:var(--panel);backdrop-filter:blur(6px);border:3px solid #fff;box-shadow:0 10px 30px rgba(120,60,150,.3),0 0 0 3px var(--pink);border-radius:26px;padding:22px 34px;display:flex;flex-direction:column;gap:11px;min-width:300px;max-width:92%;max-height:96%;overflow:auto;text-align:center}
h1,h2{font-family:'Bowlby One',Impact,sans-serif;font-weight:400;margin:0;color:var(--pink);line-height:1.1;text-shadow:0 3px 0 rgba(75,42,115,.16)}
h1{font-size:clamp(28px,5vw,46px)}h2{font-size:clamp(22px,3.5vw,32px)}
p{margin:0;font-weight:700;opacity:.85}
button{font:800 17px Nunito,system-ui,sans-serif;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:11px 26px;box-shadow:0 4px 0 var(--pinkd);cursor:pointer;transition:transform .12s,box-shadow .12s}
button:hover:not(:disabled){transform:translateY(-2px)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--pinkd)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button small{font-weight:700;font-size:13px;opacity:.9;margin-left:8px}
button.ghost,button.tab{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e6d3f5;border:2px solid #e6d3f5}
button.tab{padding:7px 20px;font-size:15px}
button.tab.on{background:#34b8a3;color:#fff;border-color:#34b8a3;box-shadow:0 4px 0 #228a79}
button.imp{background:#ff3d6e;box-shadow:0 4px 0 #b3174a,0 0 18px rgba(255,61,110,.55)}
button.err{background:#0b0b10;color:#7dfcff;box-shadow:0 4px 0 #ff2a68,0 0 18px rgba(0,255,240,.45);text-shadow:2px 0 #ff2a68,-2px 0 #00f0ff}
.tabs{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.shop-head{position:sticky;top:-22px;z-index:5;background:rgba(255,255,255,.97);padding:8px 0 10px;margin-top:-8px;border-bottom:2px solid #f0dff7;border-radius:14px}.shop-head h2{margin-top:3px}.shop-head .tabs{padding-top:3px}.shop-head .tabs button{min-height:40px}.shop-head .shop-back{font:800 15px Nunito,system-ui,sans-serif;padding:7px 20px!important;line-height:normal;box-shadow:0 4px 0 #e6d3f5!important}
.coins{font-weight:800;color:var(--pinkd)}
.row{display:flex;align-items:center;gap:12px;background:rgba(255,122,69,.12);border-radius:16px;padding:6px 12px;text-align:left}
.row b{flex:1}.row small{display:block;font-weight:700;font-size:12px;opacity:.8}
.row button{padding:6px 16px;font-size:15px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(75,42,115,.25);flex:none}
.th{width:46px;height:56px;flex:none}
textarea{width:100%;font:12px ui-monospace,Menlo,Consolas,monospace;border:2px solid #e6d3f5;border-radius:12px;padding:8px;color:var(--ink);resize:none}
.warn{background:#fff3cd;color:#7a4a00;border-radius:12px;padding:8px 12px;font-size:13px;opacity:1}
.note{background:#e6fff6;color:#0b5b46;border-radius:12px;padding:8px 12px;font-size:13px}
.grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button.sm{padding:8px 16px;font-size:15px}
.bdg{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none;border:2px solid rgba(75,42,115,.25)}
input{width:100%;font:700 16px Nunito,system-ui,sans-serif;border:2px solid #e6d3f5;border-radius:12px;padding:9px 12px;color:var(--ink);text-align:center}
.code{font:400 46px 'Bowlby One',Impact,sans-serif;letter-spacing:.18em;color:var(--pink);background:#fff3ea;border-radius:16px;padding:8px 0 8px .18em}
#hint{font-weight:700;font-size:14px;opacity:.85}
kbd{color:var(--ink);background:#fff;box-shadow:0 2px 0 #e6d3f5;border-radius:6px;padding:1px 7px;font-family:inherit;font-weight:800}
@media (prefers-reduced-motion:reduce){button{transition:none}}

<body>
<div id="stage"><canvas id="c" width="900" height="500"></canvas><div id="ui"></div><button id="pauseBtn" aria-label="Pause game">Pause (P)</button></div>
<div id="hint"><kbd>A</kbd><kbd>D</kbd> or <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp; <kbd>W</kbd>/<kbd>&uarr;</kbd>/<kbd>Space</kbd> jump &nbsp; <kbd>F</kbd> set &nbsp; <kbd>G</kbd> bump (spike while jumping) &nbsp; <kbd>H</kbd> ghost reserve (Cyrus) &nbsp; <kbd>P</kbd> pause</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
if(typeof CanvasRenderingContext2D!=='undefined'&&!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r||0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()}}
const cv=document.getElementById('c'),ui=document.getElementById('ui');let g=cv.getContext('2d'),tick=0,shopTab='cookies';
const hintEl=document.getElementById('hint'),H1=hintEl.innerHTML,H2='<b>P1</b> <kbd>A</kbd><kbd>D</kbd> move <kbd>W</kbd> jump <kbd>F</kbd> set <kbd>G</kbd> bump/spike &nbsp; <b>P2</b> <kbd>&larr;</kbd><kbd>&rarr;</kbd> move <kbd>&uarr;</kbd> jump <kbd>N</kbd> set <kbd>M</kbd> bump/spike &nbsp; <kbd>H</kbd> ghost reserve (Cyrus) &nbsp; <kbd>P</kbd> pause';
const H3=H1.replace(/ &nbsp; <kbd>P<\/kbd> pause$/,'');
let players=1,p2i=0,paused=false;
const pb=document.getElementById('pauseBtn');
function syncPB(){pb.style.display=(mode==='game'&&!paused)?'block':'none';pb.textContent=onlineOn?'Leave game':'Pause (P)'}
function togglePause(){if(mode!=='game'||onlineOn)return;paused=!paused;
 if(paused){ui.innerHTML=SCR.pause();ui.style.background='rgba(20,5,40,.4)';ui.style.display='flex';const f=ui.querySelector('button');if(f)f.focus({preventScroll:true})}
 else{ui.style.display='none';ui.innerHTML='';ui.style.background=''}
 syncPB()}
pb.addEventListener('click',()=>{pb.blur();if(onlineOn)leaveOnline();else togglePause()});
const W=900,H=500,GR=440,NX=450,NT=280,GV=0.32,BR=16,WIN=7;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SKINS=[
 {id:'butter',n:'Leo',p:0,bm:1,sm:1,d2:'The classic. No passive.'},
 {id:'choc',n:'Susan',p:100,bm:1.05,sm:1.05,d2:'Sets and bumps are 5% stronger.'},
 {id:'cheese',n:'Blake',p:250,bm:1.2,sm:1,ns:1,d2:'Bumps are 20% stronger, but you cannot set.'},
 {id:'milo',n:'Milo',p:250,bm:1,sm:1,serves:1,d2:"A serving specialist with a trick for every serve. Serve with set: overhand float serve (it wobbles in the air). Serve with bump: underhand serve (high and short). Serve with a jump spike: topspin serve (fast and it dips)."},
 {id:'wyla',n:'Wyla',p:275,bm:1,sm:1,sp:1.25,nb:1,dsp:1,d2:'You cannot bump, but spikes are 25% stronger and fly deep into their side.'},
 {id:'vanilla',n:'Hazel',p:300,bm:1.15,sm:1.15,sp:1.15,d2:'Sets, bumps and spikes are 15% stronger.'},
 {id:'joel',n:'Fisherman Joel',p:350,bm:1.55,sm:1.55,sp:1.55,dsp:1,sr:1.25,hut:1,vis:1,d2:"Everything he does is 55% stronger. Fish Bump: he pulls out a fish and sends the ball deep. Crab Hut Set: a high set that drops by the net for a spike, or goes over if he is at the net. Octo's Spike: he pulls out an octopus for a very powerful spike that flies deep, with a bigger hitbox."},
 {id:'cyrus',n:'Ghost Charmer Cyrus',p:500,bm:1,sm:1,sp:1,d2:'Starts with a ghost. Every fifth successful hit summons another, up to 5 ghosts; each ghost boosts spike power by 10%. A ghost automatically sacrifices itself to save a ball about to land on your side. Press H to sacrifice a ghost and serve by dropping the ball.'},
 {id:'poseidon',n:'Poseidon',p:0,secret:1,bm:1,sm:1,nb:1,nsp:1,shk:1,d2:"ULTRA SECRET ADMIN. Cannot bump or spike. Pressing set summons a giant shark that eats the enemy and wins the match instantly, even at 0 points."}];
const BALLS=[{id:'pepper',n:'Classic',a:'#fffaf0',b:'#3b6fd8',p:0},{id:'lemon',n:'Beach',a:'#ffd166',b:'#ef476f',p:40},{id:'grape',n:'Midnight',a:'#2a2458',b:'#ffd27a',p:80}];
const DIFF={
 easy:{n:'Easy',sp:1.9,err:140,set:.95,lag:45,miss:.38,aim:0,mult:1,spk:0,spd:0},
 medium:{n:'Medium',sp:2.6,err:90,set:.8,lag:28,miss:.26,aim:0,mult:1.25,spk:.4,spd:8.5},
 hard:{n:'Hard',sp:3.4,err:55,set:.55,lag:16,miss:.16,aim:1,mult:1.5,spk:.65,spd:10},
 impossible:{n:'IMPOSSIBLE',sp:7,err:6,set:0,lag:3,miss:.02,aim:2,mult:3,spk:.95,spd:12},
 e404:{n:'ERROR 404',sp:9.2,err:0,set:0,lag:0,miss:0,aim:3,mult:10,spk:1,spd:16}};

/* ---------- saving: several storage layers + a manual save code ---------- */
const KEY='bv4',DEF=()=>({coins:0,own:['butter','pepper'],skin:'butter',ball:'pepper',t:0,b:{},stats:{},q:null});
const validSave=s=>s&&typeof s==='object'&&typeof s.coins==='number'&&Array.isArray(s.own)&&SKINS.some(x=>x.id===s.skin)&&BALLS.some(x=>x.id===s.ball);
let migrated=false;
const parseSave=str=>{try{const s=JSON.parse(str);
 if(s&&typeof s==='object'&&Array.isArray(s.own)){if(s.own.indexOf('cacao')>=0){s.own=s.own.filter(x=>x!=='cacao');s.coins=(+s.coins||0)+350;migrated=true}if(s.skin==='cacao'){s.skin='butter';migrated=true}}
 return validSave(s)?s:null}catch(e){return null}};
const ST={
 ls:{g:()=>{try{return localStorage.getItem(KEY)}catch(e){return null}},s:v=>{try{localStorage.setItem(KEY,v);return true}catch(e){return false}}},
 ss:{g:()=>{try{return sessionStorage.getItem(KEY)}catch(e){return null}},s:v=>{try{sessionStorage.setItem(KEY,v);return true}catch(e){return false}}},
 ck:{g:()=>{try{const m=document.cookie.match(/(?:^|; )bv4=([^;]*)/);return m?decodeURIComponent(m[1]):null}catch(e){return null}},s:v=>{try{document.cookie='bv4='+encodeURIComponent(v)+';max-age=31536000;path=/;SameSite=Lax';return true}catch(e){return false}}},
 nm:{g:()=>{try{return window.name.indexOf('BV4:')===0?window.name.slice(4):null}catch(e){return null}},s:v=>{try{if(!window.name||window.name.indexOf('BV4:')===0)window.name='BV4:'+v;return true}catch(e){return false}}}};
function idbOpen(cb){try{const r=indexedDB.open('bvdb',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>cb(r.result);r.onerror=()=>cb(null)}catch(e){cb(null)}}
function idbSet(v){idbOpen(db=>{if(!db)return;try{db.transaction('s','readwrite').objectStore('s').put(v,KEY)}catch(e){}})}
function idbGet(cb){idbOpen(db=>{if(!db)return cb(null);try{const q=db.transaction('s').objectStore('s').get(KEY);q.onsuccess=()=>cb(q.result||null);q.onerror=()=>cb(null)}catch(e){cb(null)}})}
const storageOK=(function(){let a=false,b=false;try{localStorage.setItem('bvt','1');a=localStorage.getItem('bvt')==='1';localStorage.removeItem('bvt')}catch(e){}try{document.cookie='bvt=1;path=/;max-age=60';b=document.cookie.indexOf('bvt=1')>=0}catch(e){}return a||b})();
let curScr='title';
let save=(function(){try{for(const o of['bv1','bv2','bv3'])localStorage.removeItem(o)}catch(e){}
 let best=null;for(const k in ST){const s=parseSave(ST[k].g());if(s&&(!best||(s.t||0)>(best.t||0)))best=s}return best||DEF()})();
const CK=()=>SKINS.find(s=>s.id===save.skin);
const gameName=k=>k&&k.id==='cyrus'?'Cyrus':k&&k.id==='joel'?'Joel':(k?k.n:'');
function writeAll(){const v=JSON.stringify(save);for(const k in ST)ST[k].s(v);idbSet(v)}
if(migrated)writeAll();
function persist(){save.t=Date.now();writeAll()}

/* ---------- badges, daily quests and stats ---------- */
const BADGES=[
 {id:'first',n:'First Win',d:'Win a match',r:50},
 {id:'pts50',n:'Point Collector',d:'Score 50 points in total',r:75},
 {id:'spk20',n:'Spike Star',d:'Land 20 spikes',r:100},
 {id:'sweep',n:'Clean Sweep',d:'Beat anyone 7-0',r:150},
 {id:'joel',n:"Fisherman's Friend",d:'Buy Fisherman Joel',r:200},
 {id:'streak5',n:'Hot Streak',d:'Win 5 matches in a row',r:300},
 {id:'imp',n:'Impossible? Not Anymore',d:'Beat IMPOSSIBLE',r:500},
 {id:'jaden',n:"Jaden's Nightmare",d:'Beat Jaden 7-0 on IMPOSSIBLE or ERROR 404',r:1000},
 {id:'glitch',n:'Glitch Slayer',d:'Beat ERROR 404',r:1500},
 {id:'perfect',n:'Perfect Glitch',d:'Beat ERROR 404 7-0',r:3000}];
const QPOOL=[
 {id:'play2',txt:'Play 2 matches',ev:'play',goal:2,r:100,tier:0},
 {id:'pts8',txt:'Score 8 points',ev:'point',goal:8,r:100,tier:0},
 {id:'spk3',txt:'Land 3 spikes',ev:'spike',goal:3,r:100,tier:0},
 {id:'set5',txt:'Make 5 sets',ev:'set',goal:5,r:100,tier:0},
 {id:'win1',txt:'Win a match',ev:'win',goal:1,r:150,tier:1},
 {id:'pts15',txt:'Score 15 points',ev:'point',goal:15,r:150,tier:1},
 {id:'big',txt:'Win a match by 3 or more points',ev:'bigwin',goal:1,r:150,tier:1},
 {id:'spk6',txt:'Land 6 spikes',ev:'spike',goal:6,r:150,tier:1},
 {id:'winmed',txt:'Win a match on Medium or harder',ev:'winmed',goal:1,r:200,tier:2},
 {id:'win2',txt:'Win 2 matches',ev:'win',goal:2,r:200,tier:2},
 {id:'pts25',txt:'Score 25 points',ev:'point',goal:25,r:200,tier:2}];
const dayKey=()=>{const d=new Date(Date.now()-8*3600000);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function msToReset(){const n=new Date(),r=new Date(n.getFullYear(),n.getMonth(),n.getDate(),8,0,0);if(n>=r)r.setDate(r.getDate()+1);return r-n}
const leftTxt=()=>{const m=Math.max(1,Math.round(msToReset()/60000));return Math.floor(m/60)+'h '+(m%60)+'m'};
function ensureQuests(){const key=dayKey();if(save.q&&save.q.day===key&&Array.isArray(save.q.list)&&save.q.list.length===3)return false;
 let sd=0;for(let i=0;i<key.length;i++)sd=(sd*31+key.charCodeAt(i))%100003;
 const rq=i=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)};
 save.q={day:key,list:[0,1,2].map(t=>{const pool=QPOOL.filter(x=>x.tier===t);return{id:pool[Math.floor(rq(sd+t*31)*pool.length)].id,prog:0,claimed:false}})};return true}
function ensureSave(){if(!save.b||typeof save.b!=='object')save.b={};if(!save.stats||typeof save.stats!=='object')save.stats={};
 for(const k of['wins','streak','pts','spikes','played'])if(typeof save.stats[k]!=='number')save.stats[k]=0;
 if(ensureQuests())writeAll()}
function note(t){notes.push(t);if(notes.length>8)notes.shift()}
const noteHtml=()=>{let h='';for(const n of notes)h+='<p class="note">'+esc(n)+'</p>';notes=[];return h};
function track(ev,n){n=n||1;ensureSave();if(ev==='point')save.stats.pts++;if(ev==='spike')save.stats.spikes++;
 for(const q of save.q.list){const d=QPOOL.find(x=>x.id===q.id);if(d&&d.ev===ev&&!q.claimed&&q.prog<d.goal){q.prog=Math.min(d.goal,q.prog+n);if(q.prog>=d.goal)note('Quest complete: '+d.txt+'. Claim it in Daily quests.')}}}
function giveBadge(id){const b=BADGES.find(x=>x.id===id);if(!b||save.b[id])return;save.b[id]=1;save.coins+=b.r;note('Badge unlocked: '+b.n+' (+'+b.r+' coins)')}
function checkBadges(c){const S=save.stats;
 if(c&&c.win){giveBadge('first');if(c.as===0)giveBadge('sweep');if(c.mode==='impossible')giveBadge('imp');
  if(c.as===0&&(c.mode==='impossible'||c.mode==='e404'))giveBadge('jaden');
  if(c.mode==='e404'){giveBadge('glitch');if(c.as===0)giveBadge('perfect')}}
 if(S.pts>=50)giveBadge('pts50');if(S.spikes>=20)giveBadge('spk20');if(S.streak>=5)giveBadge('streak5')}
function endMatch(){if(players!==1)return;const S=save.stats,win=ps>as;S.played++;track('play');
 if(win){S.wins++;S.streak++;track('win');if(cur!=='easy')track('winmed');if(ps-as>=3)track('bigwin')}else S.streak=0;
 checkBadges({win:win,mode:cur,ps:ps,as:as})}
function claimQuest(i){ensureSave();const q=save.q.list[i],d=q&&QPOOL.find(x=>x.id===q.id);
 if(q&&d&&!q.claimed&&q.prog>=d.goal){q.claimed=true;save.coins+=d.r;persist()}show('quests')}
const claimable=()=>{ensureSave();return save.q.list.filter(q=>{const d=QPOOL.find(x=>x.id===q.id);return !q.claimed&&d&&q.prog>=d.goal}).length};
const makeCode=()=>{try{return btoa(unescape(encodeURIComponent(JSON.stringify(save))))}catch(e){return ''}};
function codeMsg(t){const m=document.getElementById('codeMsg');if(m)m.textContent=t}
function copyCode(){const ta=document.getElementById('codeOut');ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 if(ok)codeMsg('Copied. Paste it somewhere safe.');
 else if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>codeMsg('Copied. Paste it somewhere safe.'),()=>codeMsg('Press Ctrl+C (Cmd+C on Mac) to copy the selected code.'));
 else codeMsg('Press Ctrl+C (Cmd+C on Mac) to copy the selected code.')}
function loadCode(){const raw=(document.getElementById('codeIn').value||'').trim();let s=null;try{s=parseSave(decodeURIComponent(escape(atob(raw))))}catch(e){}
 if(!s){codeMsg('That code is not valid. Make sure you copied all of it.');return}
 save=s;persist();show('code');codeMsg('Progress loaded. You have '+Math.floor(save.coins)+' coins.')}

/* ---------- admin panel codes (stored only as hashes, never shown) ---------- */
const h53=(s,seed)=>{seed=seed||0;let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const CODES={'7997015864004530':{coins:1000},'3414902205677767':{unlock:'poseidon'}};
function redeem(){const el=document.getElementById('acode'),m=document.getElementById('aMsg');
 const v=String(el&&el.value||'').trim().toLowerCase().replace(/\s+/g,' '),c=CODES[h53(v)];if(el)el.value='';
 if(c){let t='Code accepted.';
  if(c.coins){save.coins+=c.coins;t='Code accepted: +'+c.coins+' coins.'}
  if(c.unlock){if(save.own.indexOf(c.unlock)>=0)t='Code accepted. That secret is already unlocked.';else{save.own.push(c.unlock);t='Code accepted. A secret character was unlocked. Check the shop.'}}
  persist();show('admin');const mm=document.getElementById('aMsg');if(mm)mm.textContent=t}
 else if(m)m.textContent='That code is not valid.'}

let mode='ui',cur='easy',cfg=DIFF.easy,st='serve',stT=0,ps=0,as=0,earned=0,msg='',msgT=0,server='p';
const keys={};
const P={x:225,y:GR,vy:0,sw:null,dir:0,col:'#ff6b5e',f:1};
const A={x:675,y:GR,vy:0,sw:null,col:'#2b2f77',f:-1,off:0,react:0,plan:false};
const A2={x:560,y:GR,vy:0,sw:null,mv:false};
const B={x:225,y:150,vx:0,vy:0,rot:0,cd:0};
let sharkWin=false,shark=null,notes=[],serving=false,serveBy='p';
let ghosts=[],ballReserved=false,cyrusHitCount=0,sacAnim=null;

/* ---------- screens ---------- */
const coinLine=()=>'<div class="coins">Coins: '+Math.floor(save.coins)+'</div>';
const btn=(label,attrs,cls)=>'<button'+(cls?' class="'+cls+'"':'')+' '+attrs+'>'+label+'</button>';

 two:()=>card('<h2>Two Players</h2><p>Player 1 serves first</p><div class="row"><b>Player 1<small>A/D move, W jump, F set, G bump (spike while jumping)</small></b><span class="coins">'+CK().n+'</span></div><div class="row"><b>Player 2<small>Arrows move and jump, N set, M bump (spike while jumping)</small></b>'+btn(CK2().n,'data-act="p2cycle"')+'</div>'+btn('Start match','data-act="start2"')+btn('Shop','data-go="shop"','ghost')+btn('Back','data-go="title"','ghost'),'min-width:420px'),

  ?card('<h2>'+(ps>as?'Player 1':'Player 2')+' wins!</h2>'+(sharkWin?'<p>The shark ate the other player!</p>':'<p>Final score '+ps+' to '+as+'</p>')+noteHtml()+btn('Rematch','data-act="rematch"')+btn('Shop','data-go="shop"')+btn('Change players','data-go="two"','ghost')+btn('Main menu','data-go="title"','ghost'))
  :card('<h2>'+(ps>as?'You win!':oppName()+(is404()?' win':' wins'))+'</h2>'+(sharkWin?'<p>The shark ate '+esc(oppName())+'!</p>':'<p>Final score '+ps+' to '+as+'</p><div class="coins">+'+earned+' coins at x'+cfg.mult+' (total '+Math.floor(save.coins)+')</div>')+noteHtml()+btn('Rematch','data-act="rematch"')+btn('Shop','data-go="shop"')+btn('Change difficulty','data-go="diff"','ghost')+btn('Main menu','data-go="title"','ghost'))
};
function show(n){ensureSave();mode='ui';if(n==='shop'&&curScr!=='shop')shopFrom=curScr;if(n==='code'&&curScr!=='code')codeFrom=curScr;curScr=n;paused=false;ui.style.background='';syncPB();
 if(n==='two'){players=2;hintEl.innerHTML=H2}else if(n==='title'||n==='menu'||n==='diff'){players=1;hintEl.innerHTML=H1}
 let html;try{html=SCR[n]()}catch(e){html=card('<h2>Oops</h2><p>Something went wrong opening that screen.</p>'+btn('Main menu','data-go="title"'))}
 ui.innerHTML=html;ui.style.display='flex';const f=ui.querySelector('input,button:not(:disabled)');if(f)f.focus({preventScroll:true});if(n==='host')refreshHost()}
ui.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 const d=b.dataset;
 if(d.go)show(d.go);
 else if(d.d)start(d.d);
 else if(d.act==='rematch'){players===2?start2():start(cur)}
 else if(d.act==='start2')start2();
 else if(d.act==='redeem')redeem();
 else if(d.act==='claimq')claimQuest(+d.i);
 else if(d.act==='hostgo'){const n=document.getElementById('hname').value;save.name=cleanName(n);writeAll();hostCreate(n)}
 else if(d.act==='joingo'){const n=document.getElementById('jname').value,c=document.getElementById('jcode').value;save.name=cleanName(n);writeAll();joinGo(n,c)}
 else if(d.act==='allow')hostAllow(d.id);
 else if(d.act==='deny')hostDeny(d.id);
 else if(d.act==='leave')leaveOnline();
 else if(d.act==='backonline'){netClose();show('online')}
 else if(d.act==='netrematch')netRematch();
 else if(d.act==='copycode')copyCode();
 else if(d.act==='loadcode')loadCode();
 else if(d.act==='resume')togglePause();
 else if(d.act==='restart'){paused=false;players===2?start2():start(cur)}
 else if(d.act==='quit'){show(players===2?'two':'diff')}
 else if(d.act==='p2cycle'){p2i=(p2i+1)%p2list().length;show('two')}
 else if(d.tab){shopTab=d.tab;show('shop')}
 else if(d.buy){const[k,id]=d.buy.split(':'),it=(k==='skin'?SKINS:BALLS).find(x=>x.id===id);
  if(!save.own.includes(id)){if(save.coins<it.p)return;save.coins-=it.p;save.own.push(id);if(id==='joel')giveBadge('joel')}
  save[k]=id;persist();show('shop')}});

/* ---------- online play: host / join with a 5 digit code ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanName=s=>(String(s||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,16))||'Player';
const skinById=id=>SKINS.find(x=>x.id===id)||SKINS[0];
const uid=()=>Math.random().toString(36).slice(2,9);
/* Connection helpers so players on different networks can reach each other.
   The TURN entries are a free public relay; swap in your own credentials here if you have them. */
const ICE={debug:0,config:{iceServers:[
 {urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:'stun:openrelay.metered.ca:80'},
 {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]}};
const pn=i=>onlineOn?netNames[i]:(i?'P2':'P1');
let onlineOn=false,onl=null,remote={l:0,r:0,j:0},netSkin=['butter','butter'],netNames=['Host','Guest'],netNote='',msgLocal=false,lastIn='';
function netSend(m){try{if(onl&&onl.send)onl.send(m)}catch(e){}}
function netClose(){const o=onl;onl=null;onlineOn=false;remote={l:0,r:0,j:0};if(!o)return;
 try{if(o.send)o.send({t:'bye'})}catch(e){}try{if(o.bc)o.bc.close()}catch(e){}try{if(o.peer)o.peer.destroy()}catch(e){}try{clearTimeout(o.timer)}catch(e){}}
function netGone(note){if(!onl&&!onlineOn)return;netClose();netNote=note;show('netinfo')}
function leaveOnline(){netClose();show('title')}

/* host side */
function hostCreate(name,tries){tries=tries||0;netClose();
 const code=String(10000+Math.floor(Math.random()*90000));
 const me=onl={role:'host',code:code,name:cleanName(name),id:'H'+uid(),pending:[],send:null,peerId:null,bc:null,peer:null,timer:null,online:false,
  status:typeof Peer!=='undefined'?'Connecting to the matchmaking server...':'Internet play is unavailable here because the online library did not load. Players on this same computer can still join.'};
 try{if(typeof BroadcastChannel!=='undefined'){me.bc=new BroadcastChannel('bvolley-'+code);
  me.bc.onmessage=e=>{const m=e.data;if(!m||(m.to&&m.to!==me.id))return;hostMsg(me,m,x=>{try{me.bc.postMessage(Object.assign({from:me.id,to:m.from},x))}catch(err){}},String(m.from))}}}catch(e){}
 try{if(typeof Peer!=='undefined'){me.peer=new Peer('bvolley-'+code,ICE);
  me.peer.on('open',()=>{if(onl===me){me.online=true;me.status='Online and waiting for players...';refreshHost()}});
  me.peer.on('connection',c=>{c.on('data',d=>hostMsg(me,d,x=>{try{c.send(x)}catch(err){}},c.peer));c.on('close',()=>{if(me.peerId===c.peer)netGone('Your opponent left the game.')})});
  me.peer.on('error',err=>{if(err&&err.type==='unavailable-id'&&tries<5){hostCreate(name,tries+1)}else if(onl===me&&!me.online){me.status='Could not reach the matchmaking server, so only players on this same computer can join right now.';refreshHost()}});
  me.timer=setTimeout(()=>{if(onl===me&&!me.online){me.status='Still trying to reach the matchmaking server. Players on this same computer can already join.';refreshHost()}},8000)}}catch(e){}
 show('host')}
function hostMsg(me,m,reply,cid){if(onl!==me||!m||typeof m!=='object')return;
 if(m.t==='hello'){if(cid===me.peerId)return;
  if(me.peerId){reply({t:'deny',why:'This game already has a player.'});return}
  if(me.pending.some(p=>p.cid===cid))return;
  me.pending.push({cid:cid,name:cleanName(m.name),skin:skinById(m.skin).id,reply:reply});refreshHost();return}
 if(cid!==me.peerId)return;
 if(m.t==='in'){remote.l=m.l?1:0;remote.r=m.r?1:0;remote.j=m.j?1:0}
 else if(m.t==='sw'&&onlineOn&&mode==='game'&&(m.ty==='bump'||m.ty==='set'||m.ty==='spike'))swing(A,m.ty,CK2());
 else if(m.t==='bye')netGone('Your opponent left the game.')}
function refreshHost(){if(!onl||onl.role!=='host')return;const hs=document.getElementById('hstat'),el=document.getElementById('reqs');if(hs)hs.textContent=onl.status;if(!el)return;
 let h='';for(const p of onl.pending)h+='<div class="row"><b>'+esc(p.name)+'<small>wants to join</small></b>'+btn('Allow','data-act="allow" data-id="'+esc(p.cid)+'"')+btn('Decline','data-act="deny" data-id="'+esc(p.cid)+'"','ghost')+'</div>';
 el.innerHTML=h}
function hostAllow(cid){const me=onl;if(!me||me.role!=='host'||me.peerId)return;const p=me.pending.find(x=>x.cid===cid);if(!p)return;
 me.peerId=cid;me.send=p.reply;
 for(const q of me.pending)if(q!==p)q.reply({t:'deny',why:'The host chose another player.'});
 me.pending=[];netSkin=[save.skin,p.skin];netNames=[me.name,p.name];remote={l:0,r:0,j:0};
 p.reply({t:'accept',hostName:me.name,hostSkin:save.skin});
 startOnlineHost()}
function hostDeny(cid){const me=onl;if(!me)return;const i=me.pending.findIndex(x=>x.cid===cid);if(i<0)return;
 me.pending[i].reply({t:'deny',why:'The host declined your request.'});me.pending.splice(i,1);refreshHost()}
function startOnlineHost(){onlineOn=true;players=2;cur='online';ps=0;as=0;earned=0;server='p';ui.style.display='none';ui.innerHTML='';hintEl.innerHTML=H3;mode='game';paused=false;syncPB();doServe()}
function netRematch(){if(!onl||onl.role!=='host'||!onl.send)return;netSkin[0]=save.skin;netSend({t:'rematch',hostName:onl.name,hostSkin:save.skin});startOnlineHost()}
function onlineEnd(){netSend({t:'over',ps:ps,as:as});show('onover')}
function sendSnap(){if(!onl||!onl.send)return;const r=v=>Math.round(v*10)/10;
 netSend({t:'s',P:[r(P.x),r(P.y),P.sw?P.sw.type:'',P.sw?P.sw.t:0,P.mv?1:0],A:[r(A.x),r(A.y),A.sw?A.sw.type:'',A.sw?A.sw.t:0,A.mv?1:0],B:[r(B.x),r(B.y),r(B.vx),r(B.vy),r(B.rot),B.fx|0],sc:[ps,as],st:st,m:msgLocal?'':msg,mt:msgLocal?0:msgT})}

/* joiner side */
function joinMsg(t){const el=document.getElementById('netMsg');if(el)el.textContent=t}
function joinGo(name,code){netClose();code=String(code||'').replace(/\D/g,'');
 if(code.length!==5){joinMsg('Enter the 5 digit code from the host.');return}
 const me=onl={role:'join',code:code,name:cleanName(name),id:'J'+uid(),send:null,via:'',bc:null,peer:null,timer:null};
 joinMsg('Asking the host to let you in...');
 const hello={t:'hello',name:me.name,skin:save.skin,from:me.id};
 const onm=(m,via,reply)=>{if(onl!==me||!m||typeof m!=='object')return;
  if(!me.send){
   if(m.t==='accept'){me.send=reply;me.via=via;clearTimeout(me.timer);joinStart(m)}
   else if(m.t==='deny'){clearTimeout(me.timer);joinMsg(String(m.why||'The host declined your request.').slice(0,80))}
   return}
  if(via!==me.via)return;
  if(m.t==='s'){if(mode==='game')applySnap(m)}
  else if(m.t==='over'){ps=m.ps|0;as=m.as|0;show('onover')}
  else if(m.t==='rematch')joinStart(m)
  else if(m.t==='bye')netGone('The host left the game.')};
 try{if(typeof Peer!=='undefined'){me.peer=new Peer(undefined,ICE);
  me.peer.on('open',()=>{const c=me.peer.connect('bvolley-'+code,{reliable:true});
   c.on('open',()=>c.send(hello));c.on('data',d=>onm(d,'peer',x=>{try{c.send(x)}catch(err){}}));
   c.on('iceStateChanged',s2=>{if(onl===me&&!me.send&&s2==='failed')joinMsg('Found the host but could not connect through your networks. Try again, or try a different network.')});
   c.on('close',()=>{if(onl===me&&me.via==='peer')netGone('The host left the game.')})});
  me.peer.on('error',err=>{if(!(onl===me&&!me.send))return;const ty=err&&err.type;
   if(ty==='peer-unavailable')joinMsg('No game found with that code yet. Check it and try again.');
   else if(ty==='network'||ty==='server-error'||ty==='socket-error'||ty==='socket-closed')joinMsg('Could not reach the matchmaking server. Check your internet connection.')})}}catch(e){}
 try{if(typeof BroadcastChannel!=='undefined'){me.bc=new BroadcastChannel('bvolley-'+code);
  me.bc.onmessage=e=>{const m=e.data;if(!m||(m.to&&m.to!==me.id))return;onm(m,'bc',x=>{try{me.bc.postMessage(Object.assign({from:me.id,to:m.from},x))}catch(err){}})};
  me.bc.postMessage(hello)}}catch(e){}
 me.timer=setTimeout(()=>{if(onl===me&&!me.send)joinMsg('Could not reach that game. Check the code, make sure the host has created the game, and that you both have internet.')},25000)}
function joinStart(m){onlineOn=true;players=2;cur='online';netNames=[cleanName(m.hostName),onl.name];netSkin=[skinById(m.hostSkin).id,save.skin];
 ps=0;as=0;st='serve';msg='';msgT=0;P.sw=A.sw=null;P.x=225;A.x=675;P.y=A.y=GR;B.x=225;B.y=150;B.vx=0;B.vy=0;B.fx=0;lastIn='';
 ui.style.display='none';ui.innerHTML='';hintEl.innerHTML=H3;mode='game';paused=false;syncPB()}
function applySnap(m){if(!Array.isArray(m.P)||!Array.isArray(m.A)||!Array.isArray(m.B))return;
 const f=(c,a)=>{c.x=+a[0]||0;c.y=+a[1]||GR;c.sw=a[2]?{type:String(a[2]),t:+a[3]||1,done:true}:null;c.mv=!!a[4]};
 f(P,m.P);f(A,m.A);B.x=+m.B[0]||0;B.y=+m.B[1]||0;B.vx=+m.B[2]||0;B.vy=+m.B[3]||0;B.rot=+m.B[4]||0;B.fx=+m.B[5]||0;
 if(Array.isArray(m.sc)){ps=m.sc[0]|0;as=m.sc[1]|0}
 st=String(m.st||'play');
 if(m.mt>0){msg=String(m.m||'').slice(0,40);msgT=m.mt|0}}
function joinTick(){const i=inp(A),key=(i.dir<0?1:0)+','+(i.dir>0?1:0)+','+(i.jump?1:0);
 if(key!==lastIn){lastIn=key;netSend({t:'in',l:i.dir<0,r:i.dir>0,j:!!i.jump})}
 if(msgT>0)msgT--}
function netKey(code){const ty=code==='KeyG'?(A.y<GR-16?'spike':'bump'):code==='KeyF'?'set':'';if(!ty)return;const ck=skinById(netSkin[1]);
 if(ty==='spike'&&A.y>=GR-16){say2('Jump to spike!',35);return}
 if(ty==='bump'&&ck.nb){say2(ck.n+" can't bump!",50);return}
 if(ty==='set'&&ck.ns){say2(ck.n+" can't set!",50);return}

function drawGhost(x,y){g.save();g.translate(x,y);g.globalAlpha=.82;g.fillStyle='#d8f5ff';g.shadowColor='#a9eaff';g.shadowBlur=18;g.beginPath();g.arc(0,-5,13,Math.PI,0);g.lineTo(13,12);g.lineTo(6,7);g.lineTo(0,13);g.lineTo(-6,7);g.lineTo(-13,12);g.closePath();g.fill();g.shadowBlur=0;g.fillStyle='#252044';g.beginPath();g.arc(-4,-5,2,0,7);g.arc(4,-5,2,0,7);g.fill();g.restore()}
function drawBall(){const bk=BALLS.find(b=>b.id===save.ball);
 g.fillStyle='rgba(40,15,50,.25)';const sh=clamp(1-(GR-B.y)/500,.3,1);g.beginPath();g.ellipse(B.x,GR+4,BR*sh,4*sh,0,0,7);g.fill();
 if(B.y<BR){B.y=BR}
 if(B.fx>0){g.strokeStyle='rgba(255,255,255,'+(B.fx/40)+')';g.lineWidth=8;g.lineCap='round';g.beginPath();g.moveTo(B.x,B.y);g.lineTo(B.x-B.vx*2.4,B.y-B.vy*2.4);g.stroke()}
 g.save();g.translate(B.x,B.y);g.rotate(B.rot);g.fillStyle=bk.a;g.beginPath();g.arc(0,0,BR,0,7);g.fill();
 g.strokeStyle=bk.b;g.lineWidth=3;g.lineCap='round';for(let i=0;i<3;i++){g.rotate(2.0944);g.beginPath();g.arc(-BR,0,BR*.95,-.9,.9);g.stroke()}
 g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=1.6;g.beginPath();g.arc(0,0,BR-.8,0,7);g.stroke();g.restore()
 g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.ellipse(B.x-5,B.y-6,4,2.4,-.6,0,7);g.fill()}
function txt(t,x,y,size,col,al){g.font=size+'px "Bowlby One",Impact,sans-serif';g.textAlign=al||'center';g.lineWidth=5;g.strokeStyle='rgba(110,50,170,.9)';g.strokeText(t,x,y);g.fillStyle=col||'#fff4e0';g.fillText(t,x,y)}
function pill(x,y,w,h){g.fillStyle='rgba(255,255,255,.88)';g.beginPath();g.roundRect(x,y,w,h,h/2);g.fill()}
function ptxt(t,x,y,size,col,al,mw){g.font=size+'px "Bowlby One",Impact,sans-serif';g.textAlign=al;g.fillStyle=col;g.fillText(t,x,y,mw||400)}
function glitch(){g.fillStyle='rgba(70,0,25,.22)';g.fillRect(0,0,W,H);
 if(tick%53<5){for(let i=0;i<4;i++){const gy=rnd(tick*3+i)*H;g.fillStyle=i%2?'rgba(0,255,240,.22)':'rgba(255,40,90,.25)';g.fillRect(0,gy,W,3+rnd(tick+i)*10)}}}
function draw(){
 g.save();
 if(mode==='game'&&shark){const k=shark,e=k.done?Math.max(0,k.fade/24):1,z=1+e*(.06*Math.min(1,k.t/50)+(k.bite>0?.05*k.bite/26:0)),amp=k.bite>0?k.bite*.35:0;
  g.translate(W/2+(rnd(tick*7)-.5)*amp*2,H/2+(rnd(tick*7+3)-.5)*amp*2);g.scale(z,z);g.translate(-W/2,-H/2)}
 g.drawImage(bg,0,0);if(is404()&&mode==='game'&&!A2.eaten)drawPlayer(A2,-1,JADEN,false,true);if(!A.eaten)drawPlayer(A,-1,onlineOn?skinById(netSkin[1]):(players===2?CK2():OPP()),mode==='game'&&players===1&&(cur==='impossible'||cur==='e404'));if(!P.eaten)drawPlayer(P,1,onlineOn?skinById(netSkin[0]):CK(),false);
 if(mode==='game'){if(players===1&&CK().id==='cyrus'){ghosts.forEach((gh,i)=>{gh.phase+=.04;gh.x+=(P.x+55+i*17-gh.x)*.025;gh.y=P.y-145+Math.sin(tick/12+gh.phase)*18;drawGhost(gh.x,gh.y)})}if(sacAnim){const a=Math.max(0,1-sacAnim.frame/30);g.save();g.globalAlpha=a;g.shadowColor='#a9eaff';g.shadowBlur=22;drawGhost(sacAnim.x,sacAnim.y);g.strokeStyle='rgba(210,250,255,'+a+')';g.lineWidth=3;g.beginPath();g.moveTo(sacAnim.x,sacAnim.y);g.lineTo(sacAnim.tx,sacAnim.ty);g.stroke();g.restore();if(sacAnim.frame<24){g.save();g.globalAlpha=a;g.fillStyle='#d8f5ff';for(let i=0;i<7;i++){const ang=i*6.283/7+sacAnim.frame*.18,rad=sacAnim.frame*1.1;g.beginPath();g.arc(sacAnim.tx+Math.cos(ang)*rad,sacAnim.ty+Math.sin(ang)*rad,2.5,0,7);g.fill()}g.restore()}}drawBall();if(shark&&!shark.done)drawShark();if(is404())glitch()}
 g.restore();
 if(mode==='game'){if(shark)cinema();
  pill(16,14,170,48);ptxt(onlineOn?netNames[0]:gameName(CK()),34,47,20,'#5b2a86','left',100);ptxt(ps,170,48,28,'#ff7a45','right');
  pill(W-186,14,170,48);ptxt(onlineOn?netNames[1]:(players===2?gameName(CK2()):oppName()),W-168,47,20,'#5b2a86','left',100);ptxt(as,W-32,48,28,'#ff7a45','right');
  if(players===1){pill(W/2-105,14,210,36);ptxt(cfg.n,W/2-92,39,16,cfg.aim===2?'#e0245e':'#5b2a86','left');ptxt('x'+cfg.mult+' coins',W/2+95,39,14,'#d4532a','right')}else{pill(W/2-80,14,160,36);ptxt(onlineOn?'Online match':'Two players',W/2,39,16,'#5b2a86','center')}
  if(msgT>0&&msg)txt(msg,W/2,150,40)}}

/* ---------- input + loop ---------- */
function swing(c,ty,ck){if(c.sw)return;
 if(ty==='spike'&&ck.nsp){say2(ck.n+" can't spike!",50);return}
 if(ty==='spike'&&c.y>=GR-16){say2('Jump to spike!',35);return}
 if(ty==='bump'&&ck.nb){say2(ck.n+" can't bump!",50);return}
 if(ty==='set'&&ck.ns){say2(ck.n+" can't set!",50);return}
 if(ty==='set'&&ck.shk){if(st==='play'||st==='serve'){startShark(c);c.sw={type:'set',t:18,done:true}}return}
 c.sw={type:ty,t:18,done:false}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(['arrowleft','arrowright','arrowup','arrowdown',' ',','].includes(k)&&mode==='game')e.preventDefault();
 keys[k]=true;
 if(mode!=='game')return;
 if(onlineOn){if(e.repeat)return;if(onl.role==='join')netKey(e.code);else if(e.code==='KeyG')swing(P,P.y<GR-16?'spike':'bump',CK());else if(e.code==='KeyF')swing(P,'set',CK());return}
 if(k==='escape'||k==='p'){if(!e.repeat)togglePause();return}
 if(k==='h'&&!e.repeat&&CK().id==='cyrus'&&ghosts.length>0){startGhostSacrifice();return}
 if(paused||e.repeat)return;
 if(e.code==='KeyG')swing(P,P.y<GR-16?'spike':'bump',CK());else if(e.code==='KeyF')swing(P,'set',CK());
 else if(players===2){if(e.code==='KeyM')swing(A,A.y<GR-16?'spike':'bump',CK2());else if(e.code==='KeyN')swing(A,'set',CK2())}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(mode==='game'&&!paused&&!onlineOn)togglePause()});
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){if(mode==='game'&&!paused){if(onlineOn&&onl&&onl.role==='join')joinTick();else update()}acc-=1000/60}tick++;draw();requestAnimationFrame(loop)}
buildBG();show('title');
idbGet(str=>{const s=parseSave(str);if(s&&(s.t||0)>(save.t||0)){save=s;writeAll();if(mode==='ui'&&curScr!=='over'&&curScr!=='code')show(curScr)}else if(save.t)idbSet(JSON.stringify(save))});
requestAnimationFrame(loop);
</script>
